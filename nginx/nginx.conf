# Reverse proxy for the production stack (docker-compose.prod.yml). Routes /api/* to the
# backend (FastAPI already mounts everything, including /api/docs, under that prefix --
# see backend/app/api/router.py) and everything else to the frontend (Next.js standalone
# server). Plain HTTP on 80: this assumes an edge proxy (Cloudflare, per
# docs/04-architecture/deployment.md) terminates TLS and forwards here -- see
# nginx/README.md if you are not using one and need this container to terminate TLS
# itself.

server {
    listen 80;
    server_name _;

    # Matches backend/app/core/config.py's document_max_size_bytes (25 MB) with headroom,
    # so nginx never rejects a valid upload before the app's own size check runs.
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI extraction can legitimately take up to ai_extraction_timeout_seconds (120s
        # default, backend/app/core/config.py) -- give the proxy room for that plus the
        # policy-evaluation/anchoring calls that can follow in the same request.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev/HMR websocket upgrade isn't needed in production (standalone
        # server), but kept harmless/forward-compatible if that ever changes.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
