# Ambiente de DESENVOLVIMENTO do JuriSense.
# O banco é o PostgreSQL gerenciado externo (DATABASE_URL em backend/.env);
# aqui sobem apenas frontend, backend e Redis.
# Uso: docker compose up -d
# Variáveis: o backend carrega backend/.env (env_file) e o bloco environment
# sobrepõe apenas o que muda dentro do container (ex.: host do Redis).

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: jurisense-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: dev
    container_name: jurisense-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - documents_data:/dados/empresas
    # DATABASE_URL (banco externo) e demais segredos vêm do backend/.env
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      # Dentro do container o Redis é o serviço "redis", não localhost
      REDIS_URL: redis://redis:6379/0
      DOCUMENTS_ROOT: /dados/empresas
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: jurisense-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
  documents_data:
  frontend_node_modules:
  frontend_next:
  backend_venv:
