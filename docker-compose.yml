# Ambiente de DESENVOLVIMENTO do JuriSense.
# Em produção (VPS) o banco é gerenciado externo; aqui sobe um Postgres local.
# Uso: docker compose up -d
# Variáveis: todos os valores têm default de desenvolvimento; para sobrescrever,
# copie .env.example para .env na raiz (o compose lê o .env automaticamente).

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: jurisense-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: dev
    container_name: jurisense-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - documents_data:/dados/empresas
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jurisense}:${POSTGRES_PASSWORD:-jurisense}@db:5432/${POSTGRES_DB:-jurisense}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      REDIS_URL: redis://redis:6379/0
      DOCUMENTS_ROOT: /dados/empresas
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: jurisense-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jurisense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jurisense}
      POSTGRES_DB: ${POSTGRES_DB:-jurisense}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jurisense-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  redis_data:
  documents_data:
  frontend_node_modules:
  frontend_next:
  backend_venv:
