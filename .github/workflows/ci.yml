name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres and Redis are faked in-process by the test suite (sqlite+aiosqlite,
    # fakeredis -- see tests/conftest.py), so neither needs a service here. Object
    # storage is not: contract-upload tests make real boto3 calls against
    # `settings.storage_endpoint_url` (default `http://localhost:9090`, same as
    # docker-compose.yml's `s3mock` service) -- without this service, every test that
    # touches storage fails with `EndpointConnectionError` (confirmed live: 29 failures,
    # GitHub Actions run 36800916271, 2026-10-01, after this gap went unnoticed through
    # several pushes once EPIC-3 added storage-backed contract tests).
    services:
      s3mock:
        image: adobe/s3mock:latest
        ports:
          - 9090:9090
        env:
          initialBuckets: jurisense-dev
        options: >-
          --health-cmd "wget --spider -q http://localhost:9090/ || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
