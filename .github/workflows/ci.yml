name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres and Redis are faked in-process by the test suite (sqlite+aiosqlite,
    # fakeredis -- see tests/conftest.py), so neither needs a service here. Object
    # storage is not: contract-upload tests make real boto3 calls against
    # `settings.storage_endpoint_url` (default `http://localhost:9090`, same as
    # docker-compose.yml's `s3mock` service) -- without this service, every test that
    # touches storage fails with `EndpointConnectionError` (confirmed live: 29 failures,
    # GitHub Actions run 36800916271, 2026-10-01, after this gap went unnoticed through
    # several pushes once EPIC-3 added storage-backed contract tests).
    services:
      s3mock:
        image: adobe/s3mock:latest
        ports:
          - 9090:9090
        env:
          # Live-verified (2026-10-01): the env var docker-compose.yml used
          # (`initialBuckets`) does NOT create the bucket on this image's current
          # "latest" tag (S3Mock 5.x) -- confirmed by running the image fresh and listing
          # buckets, which came back empty, causing every storage-backed test to fail
          # with `NoSuchBucket` instead of connecting cleanly. The correct variable,
          # confirmed to actually create the bucket, is documented at
          # https://github.com/adobe/S3Mock as `COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS`
          # (comma-separated bucket list) -- docker-compose.yml is fixed to match in the
          # same commit.
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: jurisense-dev
        options: >-
          --health-cmd "wget --spider -q http://localhost:9090/ || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Dependency scan (pip-audit)
        run: uv run --with pip-audit pip-audit

      - name: Test (pytest)
        run: uv run pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Dependency scan (npm audit)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not just this push's diff -- #111's acceptance criterion wants
          # the full git history scanned, not only new commits. Re-scanning the whole
          # (currently small) history on every push is simpler and strictly stronger than
          # a diff-only scan plus a separate scheduled full-history job, at a cost that's
          # negligible at this repo's current size.
          fetch-depth: 0

      - name: Run gitleaks
        # The `gitleaks/gitleaks-action` Marketplace Action requires a free license key
        # for organization-owned repos (this one is -- confirmed via `gh api
        # orgs/Astreus-J`); the underlying `gitleaks` CLI itself is plain MIT-licensed
        # with no key/account requirement for anyone, on any repo -- running the official
        # image directly sidesteps the Action wrapper's licensing gate entirely.
        # `.gitleaksignore` at the repo root suppresses one confirmed false positive
        # (a `token=body.token` password-reset-token parameter, not a real secret) found
        # while verifying this step live before adding it.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact -v
